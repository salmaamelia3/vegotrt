
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Full Video</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at center,#321010 0%,#10090b 48%,#050505 100%);font-family:Arial,sans-serif;color:#fff}
.container{width:100%;max-width:700px;text-align:center}
h1{font-size:clamp(25px,5vw,40px);margin-bottom:12px;text-shadow:0 0 18px #ff2929}
.subtitle{color:#d4bcbc;margin-bottom:25px;font-size:15px}
.thumbnail{position:relative;width:100%;overflow:hidden;border-radius:18px;border:2px solid #ff3333;box-shadow:0 0 20px #ff151566,0 0 45px #ff151522;cursor:pointer}
.thumbnail img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;transition:transform .5s}
.thumbnail:hover img{transform:scale(1.06)}
.thumb-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#00000020}
.play-circle{width:82px;height:82px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(145deg,#ff4242,#c90000);border:3px solid white;box-shadow:0 0 20px #f00,0 0 45px #ff202077;animation:pulse 1.7s infinite}
.play-circle:after{content:"";margin-left:7px;border-left:25px solid white;border-top:16px solid transparent;border-bottom:16px solid transparent}
.hd{position:absolute;top:12px;left:12px;padding:7px 11px;border-radius:6px;background:#e00000;font-size:13px;font-weight:900;box-shadow:0 0 12px #f00}
.duration{position:absolute;right:12px;bottom:12px;padding:6px 9px;border-radius:5px;background:#000c;font-size:13px}
.caption{margin:22px 0;font-size:clamp(17px,3vw,23px);font-weight:bold;color:#fff}
.watch-btn{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:13px;width:100%;min-height:76px;padding:17px 20px;overflow:hidden;border:2px solid #ff6565;border-radius:15px;background:linear-gradient(180deg,#ff3838 0%,#e00000 48%,#9c0000 100%);color:white;text-decoration:none;font-size:clamp(20px,4vw,29px);font-weight:900;letter-spacing:1px;text-shadow:0 2px 2px #650000;box-shadow:0 7px 0 #620000,0 10px 20px #ff000044,0 0 25px #ff171766;transition:transform .2s,box-shadow .2s;animation:fireGlow 2s infinite alternate}
.watch-btn:before{content:"";position:absolute;inset:-50%;z-index:-1;background:linear-gradient(110deg,transparent 40%,#ffffff66 50%,transparent 60%);transform:translateX(-100%) rotate(10deg);animation:shine 3s infinite}
.watch-btn:hover{transform:translateY(-4px);box-shadow:0 10px 0 #620000,0 15px 35px #ff171788,0 0 35px #ff2525}
.watch-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #620000}
.btn-play{width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent;border-left:17px solid white;filter:drop-shadow(0 0 5px white)}
.btn-arrow{font-size:30px;transition:transform .25s}
.watch-btn:hover .btn-arrow{transform:translateX(6px)}
.note{margin-top:25px;color:#a99797;font-size:12px;letter-spacing:2px}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 20px #f00,0 0 45px #ff202077}50%{transform:scale(1.09);box-shadow:0 0 35px #f00,0 0 65px #ff202099}}
@keyframes fireGlow{from{filter:brightness(1)}to{filter:brightness(1.15)}}
@keyframes shine{0%,55%{transform:translateX(-100%) rotate(10deg)}100%{transform:translateX(100%) rotate(10deg)}}
@media(max-width:480px){.play-circle{width:65px;height:65px}.play-circle:after{border-left-width:21px;border-top-width:13px;border-bottom-width:13px}.watch-btn{min-height:65px;gap:10px;padding:14px 10px;letter-spacing:.5px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="container">
  <h1>Wait… Have You Seen This? 👀</h1>
  <p class="subtitle">There's more than meets the eye.</p>

  <div class="thumbnail" onclick="goVideo()" role="link" tabindex="0" aria-label="Watch video">
    <img src="https://cdn.aceimg.com/ei9lMnzlx.jpg" alt="Video thumbnail">
    <div class="thumb-overlay"><div class="play-circle"></div></div>
    <span class="hd">HD</span>
    <span class="duration">▶ WATCH NOW</span>
  </div>

  <div class="caption">The ending might surprise you… 🔥</div>

  <a class="watch-btn" href="https://t.co/h4zemwCH2w" target="_blank" rel="noopener noreferrer">
    <span class="btn-play"></span>
    <span>WATCH FULL VIDEO</span>
    <span class="btn-arrow">»</span>
  </a>

  <div class="note">✦ KEEP WATCHING ✦</div>
</div>
<script>
function goVideo(){window.location.href="https://t.co/PFu2wprms6"}
document.querySelector(".thumbnail").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();goVideo()}});
</script>
</body>
</html>
